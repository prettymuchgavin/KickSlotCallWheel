<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Slot Caller Wheel</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Pusher JS (for Kick Chat) -->
    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>

    <!-- Canvas Confetti (for Winner celebration) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div id="app">
        <!-- Sidebar Controls -->
        <aside id="sidebar">
            <h1>Kick Slot<br>Caller</h1>

            <div class="control-group">
                <label for="kick-username">Kick Username</label>
                <input type="text" id="kick-username" placeholder="e.g. trainwreckstv">

                <div class="mode-toggle-container"
                    style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between;">
                    <span id="mode-label" style="font-size: 0.9rem; font-weight: 600;">Slot Call Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="mode-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>

                <button id="connect-btn" class="btn btn-primary" style="margin-top: 10px;">Connect Chat</button>
            </div>

            <div class="control-group" id="manual-connection" style="display: none;">
                <label for="channel-id">Manual Channel ID (If auto-detect fails)</label>
                <input type="number" id="channel-id" placeholder="e.g. 123456">
                <button id="manual-connect-btn" class="btn btn-secondary">Connect Function</button>
            </div>

            <div class="queue-header">
                <span>Queue (<span id="queue-count">0</span>)</span>
                <button id="clear-queue-btn" class="btn"
                    style="width: auto; padding: 2px 8px; font-size: 0.7rem; background: rgba(255,255,255,0.1);">Clear</button>
            </div>

            <div id="queue-container">
                <!-- Queue Items will appear here -->
            </div>

            <div class="control-group" style="margin-top: auto; padding-top: 1.5rem; border-top: var(--glass-border);">
                <label>OBS Studio Integration</label>
                <button id="copy-obs-btn" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.6rem;">Copy Browser Source URL</button>
                <div id="copy-status" style="font-size: 0.75rem; text-align: center; margin-top: 5px; color: var(--kick-green); opacity: 0; transition: opacity 0.3s;">Copied to clipboard!</div>
            </div>

        </aside>

        <!-- Main Stage -->
        <main id="stage">
            <div class="instruction-banner">use <span>!slotcall [name]</span> to call a slot!</div>

            <div id="wheel-container">
                <canvas id="wheel-canvas" width="800" height="800"></canvas>
                <button id="spin-btn">SPIN</button>
            </div>

            <!-- Recent Winners Bar -->
            <div id="recent-bar">
                <span class="recent-label">History:</span>
                <div id="recent-list"></div>
            </div>
        </main>

        <!-- Winner Modal -->
        <div id="winner-modal">
            <div class="winner-card">
                <div class="winner-text">Winner!</div>
                <div class="winner-name" id="winner-name">Username</div>
                <div class="winner-slot" id="winner-slot">Slot Name</div>
                <div style="margin-top: 2rem;">
                    <button class="btn btn-primary"
                        onclick="document.getElementById('winner-modal').classList.remove('active')">Close</button>
                </div>
            </div>
        </div>
        <!-- Ko-fi Link -->
        <a href="https://ko-fi.com/gavintyler" target="_blank" class="kofi-btn">
            <span>Support on Ko-fi</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="wheel.js"></script>
    <script src="kick.js"></script>
    <script src="script.js"></script>
</body>

</html>
