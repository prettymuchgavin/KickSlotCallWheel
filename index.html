<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Slot Caller Wheel</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Pusher JS (for Kick Chat) -->
    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>

    <!-- Canvas Confetti (for Winner celebration) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div id="app">
        <!-- Sidebar Controls -->
        <aside id="sidebar">
            <h1>Kick Slot<br>Caller</h1>

            <div class="control-group">
                <label for="kick-username">Kick Username</label>
                <input type="text" id="kick-username" placeholder="e.g. trainwreckstv">

                <div class="mode-toggle-container"
                    style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between;">
                    <span id="mode-label" style="font-size: 0.9rem; font-weight: 600;">Slot Call Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="mode-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="entries-toggle-container"
                    style="position: relative; margin-top: 15px; display: flex; align-items: center; justify-content: space-between;">
                    <span id="entries-label" style="font-size: 0.9rem; font-weight: 600; color: var(--kick-green);">Entries Open</span>
                    <label class="switch">
                        <input type="checkbox" id="accept-entries-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                    <div id="entries-reminder-popup" class="reminder-popup" style="display: none;">
                        remember to turn on entries!
                    </div>
                </div>

                <div id="giveaway-settings-container" style="display: none; margin-top: 12px; background: rgba(0, 0, 0, 0.25); padding: 10px 12px; border-radius: 8px; border: var(--glass-border);">
                    <label for="giveaway-keyword-input" style="font-size: 0.8rem; margin-bottom: 4px;">Giveaway Keyword</label>
                    <input type="text" id="giveaway-keyword-input" placeholder="e.g. !giveaway" value="!giveaway" style="padding: 0.5rem 0.8rem; font-size: 0.85rem;">
                    
                    <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">Hide Keyword on Banner</span>
                        <label class="switch" style="transform: scale(0.85);">
                            <input type="checkbox" id="hide-keyword-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div style="margin-top: 10px; border-top: var(--glass-border); padding-top: 10px;">
                        <label for="min-watchtime-input" style="font-size: 0.8rem; margin-bottom: 4px;">Min Watch Time (Hours)</label>
                        <input type="number" id="min-watchtime-input" min="0" step="0.5" value="0" placeholder="0 = No minimum" style="padding: 0.5rem 0.8rem; font-size: 0.85rem;">
                    </div>
                </div>

                <div class="wheel-count-container"
                    style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-size: 0.9rem; font-weight: 600;">Number of Wheels</span>
                    <select id="wheel-count-select" style="padding: 5px 10px; border-radius: 6px; background: rgba(0,0,0,0.5); color: #fff; border: var(--glass-border); font-weight: 600; cursor: pointer; outline: none;">
                        <option value="1">1 Wheel</option>
                        <option value="2">2 Wheels</option>
                        <option value="3">3 Wheels</option>
                        <option value="4">4 Wheels</option>
                        <option value="5">5 Wheels</option>
                    </select>
                </div>

                <button id="connect-btn" class="btn btn-primary" style="margin-top: 15px;">Connect Chat</button>
            </div>

            <div class="control-group" id="manual-connection" style="display: none;">
                <label for="channel-id">Manual Channel ID (If auto-detect fails)</label>
                <input type="number" id="channel-id" placeholder="e.g. 123456">
                <button id="manual-connect-btn" class="btn btn-secondary">Connect Function</button>
            </div>

            <div class="queue-header">
                <span>Queue (<span id="queue-count">0</span>)</span>
                <button id="clear-queue-btn" class="btn"
                    style="width: auto; padding: 2px 8px; font-size: 0.7rem; background: rgba(255,255,255,0.1);">Clear</button>
            </div>

            <div id="queue-container">
                <!-- Queue Items will appear here -->
            </div>



        </aside>

        <!-- Main Stage -->
        <main id="stage">
            <div class="instruction-banner">use <span>!slotcall [name]</span> to call a slot!</div>

            <div id="wheels-wrapper" class="wheels-grid wheels-1">
                <!-- Dynamic wheel instances will be injected here -->
            </div>

            <button id="spin-btn">SPIN</button>

            <!-- Recent Winners Bar -->
            <div id="recent-bar">
                <span class="recent-label">History:</span>
                <div id="recent-list"></div>
                <button id="clear-history-btn" title="Clear History">Clear</button>
            </div>
        </main>

        <!-- Winner Modal -->
        <div id="winner-modal">
            <div class="winner-card">
                <div class="winner-text" id="winner-modal-title">Winner!</div>
                <div id="winners-container" style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem;">
                    <div>
                        <div class="winner-name" id="winner-name">Username</div>
                        <div class="winner-slot" id="winner-slot">Slot Name</div>
                    </div>
                </div>
                <div style="margin-top: 2rem;">
                    <button class="btn btn-primary"
                        onclick="document.getElementById('winner-modal').classList.remove('active')">Close</button>
                </div>
            </div>
        </div>
        <!-- Ko-fi Link -->
        <a href="https://ko-fi.com/gavintyler" target="_blank" class="kofi-btn">
            <span>Support on Ko-fi</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="wheel.js"></script>
    <script src="kick.js"></script>
    <script src="script.js"></script>
</body>

</html>
